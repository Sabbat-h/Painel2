<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel IMC</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
        }
        form {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            max-width: 400px;
            margin-bottom: 20px;
        }
        div {
            margin-bottom: 10px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            background: #28a745;
            color: white;
            padding: 10px;
            border: none;
            width: 100%;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #218838;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #007bff;
            color: white;
        }
    </style>
</head>
<body>

    <h1>Calculadora de IMC</h1>

    <!-- Formulário que o PainelApp manipula -->
    <form id="form-paciente">
        <div>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" required>
        </div>
        <div>
            <label for="altura">Altura (ex: 1.75):</label>
            <input type="number" id="altura" step="0.01" required>
        </div>
        <div>
            <label for="peso">Peso (ex: 70.5):</label>
            <input type="number" id="peso" step="0.1" required>
        </div>
        <button type="submit">Adicionar Cliente</button>
    </form>

    <!-- Tabela onde os resultados são renderizados -->
    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Altura (m)</th>
                <th>Peso (kg)</th>
                <th>IMC</th>
                <th>Classificação</th>
            </tr>
        </thead>
        <tbody id="tabela-resultados">
            <!-- As linhas serão inseridas dinamicamente aqui pelo JavaScript -->
        </tbody>
    </table>

    <!-- Cole o seu código JavaScript logo abaixo ou importe-o via src -->
    <script>
        // Cole a sua classe Cliente e PainelApp aqui dentro
    </script>
</body>
</html>
